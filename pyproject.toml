[project]
name = "pantree"
version = "0.3.0"
description = "Reference tree-based variant identification and classification in a pangenome graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.85",
    "click>=8.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.3",
    "networkx>=3.4.2",
    "numpy>=2.1.3",
    "pandas>=2.2.0",
    "polars>=1.35.2",
    "psutil>=6.1.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "scipy>=1.14.1",
    "setuptools>=75.6.0",
    "tqdm>=4.67.1",
]

[project.scripts]
pantree = "pantree.cli:main"
graph_var = "pantree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pantree"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=pantree",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["pantree"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pyright]
typeCheckingMode = "standard"  # or "strict"
